[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "aregeo"
version = "0.1.0"
description = "Geospatial tools for converting, validating, resolving, and verifying precise real estate property locations."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Ken Mwangi", email = "hello@kenmwangi.com" },
]

maintainers = [
    { name = "Ken Mwangi", email = "hello@kenmwangi.com" },
]

keywords = [
    "geospatial",
    "geolocation",
    "real-estate",
    "property",
    "gis",
    "kenya",
    "africa",
    "coordinates",
    "geohash",
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",

    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",

    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "geographiclib>=2.1",
    "geohash2>=1.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.urls]
Homepage = "https://github.com/kenmwangi/aregeo"
Documentation = "https://github.com/kenmwangi/aregeo#readme"
Repository = "https://github.com/kenmwangi/aregeo"
Issues = "https://github.com/kenmwangi/aregeo/issues"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "I",
    "B",
]

[tool.pyrefly]
project.includes = [
    "src/**/*.py",
    "tests/**/*.py",
]
